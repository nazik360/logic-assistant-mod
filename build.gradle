plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '6.20.0'
}

group = 'ai.logicassistant'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = uri("https://www.jitpack.io") }
}

dependencies {
    // Mindustry 159.7
    compileOnly "com.github.Anuken.Mindustry:core:v159.7"
    compileOnly "com.github.Anuken.Arc:arc-core:v159.7"
}

spotless {
    java {
        googleJavaFormat('1.15.0')
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

sourceSets {
    main {
        resources {
            srcDirs = []
        }
    }
}

jar {
    archiveFileName = "logic-assistant-mod-${version}.jar"
    archiveBaseName = "logic-assistant-mod"

    // Скомпилированные Java-классы
    from(sourceSets.main.output)

    // mod.hjson должен лежать в корне JAR
    from("mod.hjson")

    manifest {
        attributes(
            'Implementation-Title': 'Logic Assistant',
            'Implementation-Version': version,
            'Specification-Vendor': 'AI Dev',
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
        )
    }
}

tasks.named('build') {
    dependsOn spotlessApply
}

task printInfo {
    doLast {
        println """
        ========================================
          Logic Assistant Mod v${version}
        ========================================

        Group: ${group}
        Version: ${version}
        Java: ${java.toolchain.languageVersion.get()}
        Mindustry: 159.7

        Output:
        build/libs/logic-assistant-mod-${version}.jar
        """
    }
}

defaultTasks 'build'
